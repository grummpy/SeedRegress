[project]
name = "seedregress"
version = "0.1.0"
description = "Visual regression tests for ComfyUI pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pillow==12.3.0",
]

[project.optional-dependencies]
lpips = ["lpips==0.1.4", "torch>=2.2"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
seedregress = "seedregress.cli:main"

[tool.setuptools.packages.find]
include = ["seedregress*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
